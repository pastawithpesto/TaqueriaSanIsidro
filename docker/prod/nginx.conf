map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear sin límite.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Docker DNS: si el contenedor app se recrea cambia de IP, así que se resuelve en cada petición.
    resolver 127.0.0.11 valid=5s;

    # Mismo origen para el navegador; el proxy externo termina HTTPS.
    location ~ ^/apps?(?:/|$) {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Por nombre de contenedor y no de servicio: web también está en la red compartida npm,
    # donde otros stacks tienen un servicio "app" y Docker podía resolver al de ellos.
    location ~ \.php$ {
        set $php_upstream taqueria-app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
