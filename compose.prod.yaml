# ============================================
# Stack de producción para Portainer (GitOps).
#
# Portainer clona este repo, construye las imágenes con docker/prod/Dockerfile y levanta el stack.
# Los secretos no van aquí: se ponen en "Environment variables" del stack en Portainer.
#
# Stacks > Add stack > Repository:
#   - Repository URL:  la de este repo
#   - Reference:       refs/heads/main
#   - Compose path:    compose.prod.yaml
#   - Authentication:  token de GitHub, si el repo es privado
#
# Variables obligatorias: APP_KEY, APP_URL, DB_PASSWORD, REVERB_APP_ID, REVERB_APP_KEY, REVERB_APP_SECRET,
# REVERB_ALLOWED_ORIGINS (el dominio público sin https).
# Nginx Proxy Manager publica el dominio con https y reenvía a taqueria-web, puerto 80.
# ============================================

name: taqueria-prod

services:
  app:
    container_name: taqueria-app
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app
    image: taqueria-app:latest
    restart: unless-stopped
    environment: &app-environment
      APP_NAME: "Taquería San Isidro"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Falta APP_KEY}
      APP_URL: ${APP_URL:?Falta APP_URL}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Matamoros}
      ADMIN_PATH: ${ADMIN_PATH:-admon}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-taqueria}
      DB_USERNAME: ${DB_USERNAME:-taqueria}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-720}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Falta REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Falta REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Falta REVERB_APP_SECRET}
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:?Falta REVERB_ALLOWED_ORIGINS}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      MAIL_MAILER: log
      # Detrás de Nginx Proxy Manager: confía en sus encabezados para generar URLs https.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    volumes:
      # Logo subido, archivos temporales y vistas compiladas.
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taqueria

  reverb:
    image: taqueria-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: &console-environment
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taqueria

  scheduler:
    image: taqueria-app:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *console-environment
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taqueria

  web:
    container_name: taqueria-web
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    image: taqueria-web:latest
    restart: unless-stopped
    # Sin Nginx Proxy Manager, publica el puerto:
    # ports:
    #   - "8090:80"
    depends_on:
      - app
    networks:
      - taqueria
      - npm

  # Sin puertos publicados: solo la app llega a la base.
  db:
    container_name: taqueria-db
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-taqueria}
      POSTGRES_USER: ${DB_USERNAME:-taqueria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taqueria} -d ${DB_DATABASE:-taqueria}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taqueria

  # Respaldo diario de la base en el volumen "backups"; se guardan los últimos BACKUP_KEEP_DAYS días.
  # Protege contra errores y borrados, no contra perder el servidor: copia de vez en cuando un respaldo a otro lado.
  backup:
    container_name: taqueria-backup
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USERNAME:-taqueria}
      PGPASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-taqueria}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/taqueria-$$(date +%F).dump
          if pg_dump -Fc -f "$$file.tmp"; then mv "$$file.tmp" "$$file" && echo "Respaldo listo: $$file"; else rm -f "$$file.tmp"; fi
          find /backups -name 'taqueria-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taqueria

networks:
  taqueria:
    driver: bridge
  npm:
    external: true
    name: npm

volumes:
  db-data:
  storage:
  backups:
